<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - Harssh Doshi</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="customer-auth.js"></script>
    <script src="shopping-bag.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            margin-top: 20px;
            padding: 0;
            min-height: 100vh;
            background: #ffffff;
            font-family: 'Arpona Regular', sans-serif;
        }

        .nav-row a,
        pre {
            color: black !important;
        }

        .site-header.sticky {
            background: white !important;
        }

        .account-content-wrapper {
            min-height: calc(100vh - 200px);
            padding: 140px 20px 60px;
        }

        .account-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 80px;
        }

        /* Sidebar */
        .account-sidebar {
            min-width: 250px;
            flex-shrink: 0;
        }

        .sidebar-title {
            font-family: 'Arpona Regular', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 35px;
            color: #000;
            text-transform: uppercase;
        }

        .sidebar-nav {
            list-style: none;
            padding: 0;
            margin-top: 20%;
        }

        .sidebar-nav li {
            margin-bottom: 22px;
        }

        .sidebar-nav a,
        .sidebar-nav button {
            font-family: 'Arpona Regular', sans-serif;
            font-size: 13px;
            letter-spacing: 0.5px;
            color: #666;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            transition: color 0.3s ease;
            display: block;
            text-align: left;
            width: 100%;
        }

        .sidebar-nav a:hover,
        .sidebar-nav button:hover {
            color: #000;
            text-decoration: underline;
        }

        .sidebar-nav a.active,
        .sidebar-nav button.active {
            color: #000 !important;
            font-weight: 500;
        }

        /* Ensure PROFILE link is always visible */
        .sidebar-nav a[data-section="profile"] {
            color: #000 !important;
            font-weight: 500;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            text-indent: 0 !important;
            font-size: 13px !important;
            letter-spacing: 0.5px !important;
        }

        .sidebar-nav a[data-section="orders"] {
            color: #666 !important;
        }

        .sidebar-nav a[data-section="orders"].active {
            color: #000 !important;
            font-weight: 500;
        }

        /* Ensure sidebar items are fully visible on desktop */
        @media (min-width: 769px) {
            .account-sidebar {
                min-width: 250px;
                width: 250px;
                overflow: visible;
            }

            .sidebar-nav {
                width: 100%;
                overflow: visible;
            }

            .sidebar-nav li {
                width: 100%;
                overflow: visible;
            }

            .sidebar-nav a,
            .sidebar-nav button {
                width: 100%;
                white-space: normal;
                overflow: visible;
                display: block !important;
                visibility: visible !important;
                opacity: 1 !important;
            }

            .sidebar-nav a[data-section="profile"] {
                display: block !important;

                visibility: visible !important;
                opacity: 1 !important;
            }
        }

        /* Section visibility */
        .account-section {
            display: none;
        }

        .account-section.active {
            display: block;
        }

        /* Edit Profile Button */
        .edit-profile-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: #000;
            color: #fff;
            border: 1px solid #000;
            font-family: 'Arpona Regular', sans-serif;
            font-size: 12px;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .edit-profile-btn:hover {
            background: #fff;
            color: #000;
        }

        /* Orders List */
        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .order-card {
            background: #f8f8f8;
            padding: 30px;
            border: 1px solid #e0e0e0;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .order-number {
            font-family: 'Arpona Regular', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: #000;
            letter-spacing: 0.5px;
        }

        .order-date {
            font-family: 'Arpona Regular', sans-serif;
            font-size: 12px;
            color: #666;
        }

        .order-details {
            margin-bottom: 20px;
        }

        .order-detail-row {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            font-family: 'Arpona Regular', sans-serif;
            font-size: 13px;
        }

        .order-detail-label {
            color: #666;
            min-width: 80px;
        }

        .order-detail-value {
            color: #000;
        }

        .view-details-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: #000;
            color: #fff;
            border: 1px solid #000;
            font-family: 'Arpona Regular', sans-serif;
            font-size: 12px;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .view-details-btn:hover {
            background: #fff;
            color: #000;
        }

        .download-invoice-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: #fff;
            color: #000;
            border: 1px solid #000;
            font-family: 'Arpona Regular', sans-serif;
            font-size: 12px;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            margin-left: 10px;
        }

        .download-invoice-btn:hover {
            background: #000;
            color: #fff;
        }

        /* Invoice Template (Hidden) */
        #invoice-template {
            display: none;
            /* A4 width is 210mm ~794px. With margins, safe width is ~700px */
            width: 700px;
            background: #fff;
            padding: 40px;
            color: #333;
            /* Use system fonts for best PDF rendering clarity */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            box-sizing: border-box;
        }

        #invoice-template .invoice-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #000;
        }

        #invoice-template .invoice-logo {
            font-size: 28px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #000;
        }

        #invoice-template .invoice-details {
            text-align: right;
        }

        #invoice-template .invoice-details h3 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #000;
            text-transform: uppercase;
        }

        #invoice-template .invoice-details p {
            margin: 2px 0;
            color: #666;
        }

        #invoice-template .invoice-addresses {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
        }

        #invoice-template .address-box {
            width: 48%;
        }

        #invoice-template .address-box h4 {
            margin: 0 0 10px 0;
            font-size: 14px;
            text-transform: uppercase;
            color: #000;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        #invoice-template .invoice-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        #invoice-template .invoice-table th {
            text-align: left;
            padding: 12px 0;
            border-bottom: 2px solid #000;
            text-transform: uppercase;
            font-size: 12px;
            color: #000;
        }

        #invoice-template .invoice-table td {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            vertical-align: top;
        }

        #invoice-template .invoice-table td.qty-col {
            text-align: center;
            width: 60px;
        }

        #invoice-template .invoice-table td.price-col {
            text-align: right;
            width: 120px;
        }

        #invoice-template .invoice-totals {
            width: 300px;
            margin-left: auto;
            border-top: 2px solid #000;
            padding-top: 10px;
        }

        #invoice-template .total-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 14px;
        }

        #invoice-template .total-row.final {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eee;
            font-weight: 700;
            font-size: 18px;
            color: #000;
        }

        /* Main Content */
        .account-content {
            flex: 1;
        }

        .content-title {
            font-family: 'Arpona Regular', sans-serif;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 1.5px;
            margin-bottom: 30px;

            color: #000;
            text-transform: uppercase;
        }

        .info-card {
            background: #f8f8f8;
            padding: 40px;
            margin-bottom: 40px;
            color: #000;
        }

        .info-row {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.8;
            font-family: 'Arpona Regular', sans-serif;
        }

        .info-label {
            font-weight: 500;
            color: #000;
            min-width: 100px;
            font-family: 'Arpona Regular', sans-serif;
        }

        .info-value {
            color: #666;
            font-family: 'Arpona Regular', sans-serif;
        }

        .empty-message {
            color: #999;
            font-size: 14px;
            font-style: italic;
            font-family: 'Arpona Regular', sans-serif;
        }

        /* Edit Profile Inputs */
        .edit-input {
            width: 100%;
            max-width: 400px;
            padding: 10px 0;
            border: none;
            border-bottom: 1px solid #ccc;
            font-size: 14px;
            font-family: 'Arpona Regular', sans-serif;
            background: transparent;
            outline: none;
            transition: border-color 0.3s ease;
            color: #000;
        }

        .edit-input:focus {
            border-bottom-color: #000;
        }

        .edit-input:disabled {
            color: #999;
            cursor: not-allowed;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .account-content-wrapper {
                padding: 120px 20px 40px;
            }

            .account-wrapper {
                flex-direction: column;
                gap: 40px;
            }

            .account-sidebar {
                min-width: 100%;
            }

            .info-card {
                padding: 30px 20px;
            }

            .info-row {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>

    <script src="footer-loader.js"></script>
    <script>
        // Section Navigation
        document.addEventListener('DOMContentLoaded', () => {
            const navItems = document.querySelectorAll('.nav-item');
            const sections = document.querySelectorAll('.account-section');

            navItems.forEach(item => {
                item.addEventListener('click', (e) => {
                    e.preventDefault();

                    // Remove active class from all nav items
                    navItems.forEach(nav => nav.classList.remove('active'));

                    // Add active class to clicked item
                    item.classList.add('active');

                    // Hide all sections
                    sections.forEach(section => section.classList.remove('active'));

                    // Show selected section
                    const sectionId = item.getAttribute('data-section') + '-section';
                    document.getElementById(sectionId).classList.add('active');

                    // Load orders if orders section is clicked
                    if (item.getAttribute('data-section') === 'orders') {
                        loadOrders();
                    }
                });
            });

            // Load profile on page load
            loadProfile();
        });

        // Logout function
        function handleLogout() {
            if (typeof CustomerAuth !== 'undefined') {
                CustomerAuth.logout();
            } else {
                window.location.href = 'login.html';
            }
        }

        // Load user profile
        async function loadProfile() {
            console.log('Loading profile...');
            if (typeof CustomerAuth === 'undefined') {
                console.error('CustomerAuth not defined');
                window.location.href = 'login.html';
                return;
            }

            if (!CustomerAuth.isAuthenticated()) {
                console.log('Not authenticated, redirecting...');
                window.location.href = 'login.html';
                return;
            }

            let user = CustomerAuth.getUser();
            console.log('User from local storage:', user);

            if (!user) {
                console.log('User not found in local storage, fetching from API...');
                try {
                    user = await CustomerAuth.getCurrentUser();
                    console.log('User fetched from API:', user);
                } catch (error) {
                    console.error('Failed to fetch user:', error);
                    document.getElementById('profileInfo').innerHTML = '<p>Failed to load profile. Please try logging in again.</p>';
                    return;
                }
            }

            if (user) {
                const profileHTML = `
                    <div class="info-row">
                        <span class="info-label">Name:</span>
                        <span class="info-value">${user.first_name || ''} ${user.last_name || ''}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Email:</span>
                        <span class="info-value">${user.email || ''}</span>
                    </div>
                    ${user.phone ? `
                    <div class="info-row">
                        <span class="info-label">Phone:</span>
                        <span class="info-value">${user.phone}</span>
                    </div>
                    ` : ''}
                `;
                document.getElementById('profileInfo').innerHTML = profileHTML;
            } else {
                document.getElementById('profileInfo').innerHTML = '<p>Could not load user profile.</p>';
            }
        }

        // Edit Profile function
        function editProfile() {
            const user = CustomerAuth.getUser();
            if (!user) return;

            // Show editable form
            const profileHTML = `
                <div class="info-row">
                    <span class="info-label">First Name:</span>
                    <input type="text" id="edit-first-name" class="edit-input" value="${user.first_name || ''}" />
                </div>
                <div class="info-row">
                    <span class="info-label">Last Name:</span>
                    <input type="text" id="edit-last-name" class="edit-input" value="${user.last_name || ''}" />
                </div>
                <div class="info-row">
                    <span class="info-label">Email:</span>
                    <input type="email" id="edit-email" class="edit-input" value="${user.email || ''}" disabled />
                </div>
                <div class="info-row">
                    <span class="info-label">Phone:</span>
                    <input type="tel" id="edit-phone" class="edit-input" value="${user.phone || ''}" />
                </div>
                <div style="margin-top: 20px; display: flex; gap: 15px;">
                    <button class="edit-profile-btn" onclick="saveProfile()">SAVE CHANGES</button>
                    <button class="view-details-btn" onclick="cancelEdit()">CANCEL</button>
                </div>
            `;
            document.getElementById('profileInfo').innerHTML = profileHTML;

            // Hide the edit button
            document.querySelector('.edit-profile-btn[onclick="editProfile()"]').style.display = 'none';
        }

        // Cancel edit
        function cancelEdit() {
            loadProfile();
            document.querySelector('.edit-profile-btn[onclick="editProfile()"]').style.display = 'block';
        }

        // Save profile
        async function saveProfile() {
            const firstName = document.getElementById('edit-first-name').value;
            const lastName = document.getElementById('edit-last-name').value;
            const phone = document.getElementById('edit-phone').value;

            try {
                const data = await CustomerAuth.updateProfile({
                    first_name: firstName,
                    last_name: lastName,
                    phone: phone
                });

                // Update stored user data
                if (typeof CustomerAuth.updateUser === 'function') {
                    CustomerAuth.updateUser(data.customer);
                } else if (typeof CustomerAuth.storeUser === 'function') {
                    CustomerAuth.storeUser(data.customer);
                }

                // Reload profile display
                loadProfile();
                document.querySelector('.edit-profile-btn[onclick="editProfile()"]').style.display = 'block';

                alert('Profile updated successfully!');
            } catch (error) {
                console.error('Error updating profile:', error);
                alert('Failed to update profile. Please try again.');
            }
        }

        // Load orders
        async function loadOrders() {
            const ordersContainer = document.getElementById('ordersContainer');

            if (typeof CustomerAuth === 'undefined' || !CustomerAuth.isAuthenticated()) {
                ordersContainer.innerHTML = '<p class="empty-message">Please log in to view your orders.</p>';
                return;
            }

            try {
                ordersContainer.innerHTML = '<p class="empty-message">Loading orders...</p>';

                const token = CustomerAuth.getToken();
                console.log('Fetching orders with token:', token ? 'Token exists' : 'No token');

                // Expand items, payments, and fulfillments (including nested relations) to ensure we get all data
                const response = await fetch(`${API_BASE_URL}${MEDUSA_CONFIG.AUTH_ENDPOINTS.ORDERS}?expand=items,payments,fulfillments,fulfillments.items,fulfillments.labels,shipping_address`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        'x-publishable-api-key': MEDUSA_CONFIG.PUBLISHABLE_KEY
                    },
                    credentials: 'include'
                });

                console.log('Orders API Response Status:', response.status);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Orders API Error:', errorText);
                    throw new Error('Failed to fetch orders');
                }

                const data = await response.json();
                console.log('Orders API Response Data:', data);

                const orders = data.orders || [];
                console.log('Number of orders found:', orders.length);

                if (orders.length === 0) {
                    ordersContainer.innerHTML = '<p class="empty-message">You have no orders yet.</p>';
                    return;
                }

                // Display orders
                const ordersHTML = orders.map(order => {
                    console.log("Processing Order:", order);

                    const orderDate = new Date(order.created_at).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    // Calculate total if missing
                    let totalAmount = order.total;
                    if (totalAmount === undefined || totalAmount === null) {
                        if (order.items && order.items.length > 0) {
                            totalAmount = order.items.reduce((sum, item) => {
                                return sum + (item.unit_price * item.quantity);
                            }, 0);
                        } else {
                            totalAmount = 0;
                        }
                    }
                    const total = totalAmount.toFixed(2);

                    // Generate items HTML for order summary
                    const itemsHTML = (order.items || []).map(item => {
                        const thumbnail = item.thumbnail || item.variant?.product?.thumbnail || 'https://placehold.co/50x50?text=No+Img';
                        const title = item.title;
                        const quantity = item.quantity;
                        return `
                            <div style="display: flex; gap: 10px; margin-bottom: 8px; align-items: center;">
                                <img src="${thumbnail}" alt="${title}" style="width: 50px; height: 50px; object-fit: cover; background: #f0f0f0;">
                                <div>
                                    <div style="font-size: 13px; font-weight: 500;">${title}</div>
                                    <div style="font-size: 12px; color: #666;">Qty: ${quantity}</div>
                                </div>
                            </div>
                        `;
                    }).join('');

                    // Generate Fulfillments HTML
                    let fulfillmentsHTML = '';
                    if (order.fulfillments && order.fulfillments.length > 0) {
                        const fulfillmentsList = order.fulfillments.map((fulfillment, index) => {
                            // Extract labels
                            const trackingHTML = (fulfillment.labels || []).map(label => {
                                let trackingDisplay = label.tracking_number || 'N/A';
                                let trackingLink = label.tracking_url ? `<a href="${label.tracking_url}" target="_blank" style="text-decoration: underline; color: blue;">${trackingDisplay}</a>` : trackingDisplay;
                                let labelLink = label.label_url ? ` - <a href="${label.label_url}" target="_blank" style="text-decoration: underline; color: blue;">Label</a>` : '';
                                return `<div style="margin-bottom: 2px;">${trackingLink}${labelLink}</div>`;
                            }).join('') || '<div style="color: #999;">Pending</div>';

                            // Extract fulfillment items
                            const fulfillmentItemsHTML = (fulfillment.items || []).map(item => {
                                return `<div style="margin-bottom: 4px;">${item.quantity}x ${item.title}</div>`;
                            }).join('') || '<div style="color: #999;">No items details</div>';

                            // "Shipped To" per user request and provided data context
                            // Using delivery_address if available, fallback to shipping_address
                            const shippingAddr = order.shipping_address || {}; // Default to order shipping address
                            const shippingName = `${shippingAddr.first_name || ''} ${shippingAddr.last_name || ''}`.trim() || 'N/A';

                            return `
                                <div style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed #ddd;">
                                    <div style="font-weight: 600; margin-bottom: 15px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #333;">Fulfillment #${index + 1}</div>
                                    
                                    <div style="display: grid; grid-template-columns: 120px 1fr; gap: 10px; font-size: 13px; font-family: 'Arpona Regular', sans-serif; align-items: start;">
                                        
                                        <div style="color: #666; font-weight: 500;">Items</div>
                                        <div style="color: #000;">${fulfillmentItemsHTML}</div>
                                        
                                        <div style="color: #666; font-weight: 500;">Shipped To</div>
                                        <div style="color: #000; font-weight: 500;">${shippingName}</div>
                                        
                                        <div style="color: #666; font-weight: 500;">Provider</div>
                                        <div style="color: #000; text-transform: capitalize;">${(fulfillment.provider_id || 'Manual').replace(/_/g, ' ')}</div>
                                        
                                        <div style="color: #666; font-weight: 500;">Tracking</div>
                                        <div style="color: #000;">${trackingHTML}</div>
                                    </div>
                                </div>
                            `;
                        }).join('');

                        fulfillmentsHTML = `<div style="background-color: #fafafa; padding: 15px; border-radius: 4px; margin-top: 15px; border: 1px solid #eee;">${fulfillmentsList}</div>`;
                    }

                    return `
                        <div class="order-card">
                            <div class="order-header">
                                <div>
                                    <div class="order-number">Order #${order.display_id || order.id.substring(0, 8)}</div>
                                    <div class="order-date">${orderDate}</div>
                                </div>
                                <div style="display: flex; gap: 10px;">
                                    <button class="download-invoice-btn" onclick="downloadInvoice('${order.id}')">DOWNLOAD INVOICE</button>
                                </div>
                            </div>
                            <div class="order-details">
                                <div class="order-detail-row">
                                    <span class="order-detail-label">Status:</span>
                                    <span class="order-detail-value" style="font-weight: 600; text-transform: capitalize;">${order.fulfillment_status || 'Processing'}</span>
                                </div>
                                <div class="order-detail-row" style="align-items: flex-start;">
                                    <span class="order-detail-label">Items:</span>
                                    <div class="order-detail-value" style="width: 100%;">
                                        ${itemsHTML}
                                    </div>
                                </div>
                                <div class="order-detail-row">
                                    <span class="order-detail-label">Total:</span>
                                    <span class="order-detail-value">₹${total}</span>
                                </div>
                                ${fulfillmentsHTML}
                            </div>
                        </div>
                    `;
                }).join('');

                ordersContainer.innerHTML = `<div class="orders-list">${ordersHTML}</div>`;

            } catch (error) {
                console.error('Error loading orders:', error);
                ordersContainer.innerHTML = '<p class="empty-message">Failed to load orders. Please try again later.</p>';
            }
        }

        // Download Invoice Function
        async function downloadInvoice(orderId) {
            try {
                // Show temporary loading/progress
                const btn = document.querySelector(`button[onclick="downloadInvoice('${orderId}')"]`);
                const originalText = btn.textContent;
                btn.textContent = 'Generating...';
                btn.disabled = true;

                const token = CustomerAuth.getToken();

                // Fetch full order details
                // Using Medusa v2 'fields' syntax
                const response = await fetch(`${API_BASE_URL}/store/orders/${orderId}?fields=+items,+shipping_address,+billing_address,+payments,+fulfillments,+region,+currency`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        'x-publishable-api-key': MEDUSA_CONFIG.PUBLISHABLE_KEY
                    }
                });

                if (!response.ok) throw new Error('Failed to fetch order details');

                const data = await response.json();
                console.log("Full Order Data for Invoice:", data);
                const order = data.order;

                // Prepare Invoice Data
                const date = new Date(order.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                const subtotal = order.subtotal.toFixed(2);
                const tax = order.tax_total.toFixed(2);
                const shipping = order.shipping_total.toFixed(2);
                const total = order.total.toFixed(2);
                const email = order.email;

                const itemsHTML = order.items.map(item => `
                    <tr>
                        <td>
                            <div style="font-weight: 600; color: #000;">${item.title}</div>
                            <div style="font-size: 12px; color: #666; margin-top: 4px;">${item.variant?.title !== 'Default Variant' ? item.variant?.title || '' : ''}</div>
                        </td>
                        <td class="qty-col">${item.quantity}</td>
                        <td class="price-col">₹${item.unit_price.toFixed(2)}</td>
                        <td class="price-col">₹${(item.unit_price * item.quantity).toFixed(2)}</td>
                    </tr>
                `).join('');

                const shippingAddr = order.shipping_address || {};
                const billingAddr = order.billing_address || shippingAddr;

                // Populate Template
                const template = document.getElementById('invoice-template');
                template.innerHTML = `
                    <div class="invoice-header">
                        <div class="invoice-branding">
                            <h2 style="margin: 0; font-size: 24px; text-transform: uppercase;">Harssh Doshi</h2>
                            <p style="margin: 5px 0 0; color: #666; font-size: 14px;">Luxury Jewellery</p>
                            <p style="margin: 2px 0 0; color: #666; font-size: 14px;">India</p>
                        </div>
                        <div class="invoice-details">
                            <h3 style="margin: 0 0 10px; font-size: 24px;">INVOICE</h3>
                            <p><strong>Order ID:</strong> ${order.display_id}</p>
                            <p><strong>Date:</strong> ${date}</p>
                            <p><strong>Status:</strong> ${order.payment_status}</p>
                        </div>
                    </div>

                    <div class="invoice-addresses">
                        <div class="address-box">
                            <h4 style="margin-bottom: 10px; font-size: 12px; color: #999; text-transform: uppercase;">BILLED TO</h4>
                            <p><strong>${billingAddr.first_name || ''} ${billingAddr.last_name || ''}</strong></p>
                            ${billingAddr.company ? `<p>${billingAddr.company}</p>` : ''}
                            <p>${billingAddr.address_1 || ''}</p>
                            ${billingAddr.address_2 ? `<p>${billingAddr.address_2}</p>` : ''}
                            <p>${billingAddr.city || ''}, ${billingAddr.province || ''} ${billingAddr.postal_code || ''}</p>
                            <p>${billingAddr.country_code ? billingAddr.country_code.toUpperCase() : ''}</p>
                            <p>${email || ''}</p>
                            <p>${billingAddr.phone || ''}</p>
                        </div>
                        <div class="address-box">
                            <h4 style="margin-bottom: 10px; font-size: 12px; color: #999; text-transform: uppercase;">SHIPPED TO</h4>
                            <p><strong>${shippingAddr.first_name || ''} ${shippingAddr.last_name || ''}</strong></p>
                            ${shippingAddr.company ? `<p>${shippingAddr.company}</p>` : ''}
                            <p>${shippingAddr.address_1 || ''}</p>
                            ${shippingAddr.address_2 ? `<p>${shippingAddr.address_2}</p>` : ''}
                            <p>${shippingAddr.city || ''}, ${shippingAddr.province || ''} ${shippingAddr.postal_code || ''}</p>
                            <p>${shippingAddr.country_code ? shippingAddr.country_code.toUpperCase() : ''}</p>
                            <p>${shippingAddr.phone || ''}</p>
                        </div>
                    </div>

                    <table class="invoice-table" style="margin-top: 40px;">
                        <thead>
                            <tr>
                                <th style="width: 50%; color: #999; font-size: 12px;">ITEM</th>
                                <th style="width: 10%; text-align: center; color: #999; font-size: 12px;">QTY</th>
                                <th style="width: 20%; text-align: right; color: #999; font-size: 12px;">PRICE</th>
                                <th style="width: 20%; text-align: right; color: #999; font-size: 12px;">TOTAL</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itemsHTML}
                        </tbody>
                    </table>

                    <div class="invoice-totals">
                        <div class="total-row"><span>Subtotal:</span> <span>₹${subtotal}</span></div>
                        <div class="total-row"><span>Shipping:</span> <span>₹${shipping}</span></div>
                        <div class="total-row"><span>Tax:</span> <span>₹${tax}</span></div>
                        <div class="total-row final"><span>Total:</span> <span>₹${total}</span></div>
                    </div>
                `;

                // Generate PDF
                const opt = {
                    margin: 10,
                    filename: `Invoice_${order.display_id}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                // Render
                template.style.display = 'block'; // Show temporarily
                await html2pdf().set(opt).from(template).save();
                template.style.display = 'none'; // Hide again

                // Reset button
                btn.textContent = originalText;
                btn.disabled = false;

            } catch (error) {
                console.error('Invoice generation error:', error);
                alert('Failed to generate invoice. Please try again.');
                const btn = document.querySelector(`button[onclick="downloadInvoice('${orderId}')"]`);
                if (btn) {
                    btn.textContent = 'DOWNLOAD INVOICE';
                    btn.disabled = false;
                }
            }
        }

        // View order details
        function viewOrderDetails(orderId) {
            // Redirect to order details page
            window.location.href = `order-details.html?id=${orderId}`;
        }
    </script>
    <script>
        // Sticky Header
        window.addEventListener("scroll", () => {
            const header = document.querySelector(".site-header");
            if (window.innerWidth > 768) {
                header.classList.toggle("sticky", window.scrollY > 0);
            }
        });

        // Mobile Menu Toggle
        const mobileToggle = document.querySelector("#menuToggle");
        const mobileMenu = document.querySelector("#mobileMenu");
        const closeMenuBtn = document.getElementById("closeMenuBtn");

        if (mobileToggle) {
            mobileToggle.addEventListener("click", () => {
                mobileMenu.classList.toggle("active");
                document.body.classList.toggle("no-scroll", mobileMenu.classList.contains("active"));
            });
        }

        if (closeMenuBtn) {
            closeMenuBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                mobileMenu.classList.remove("active");
                document.body.classList.remove("no-scroll");
            });
        }

        // Update auth links based on login status
        function updateAuthLinks() {
            if (typeof CustomerAuth === 'undefined') return;

            const accountLink = document.getElementById('accountLink');
            const loginLink = document.getElementById('loginLink');
            const accountLinkSticky = document.getElementById('accountLinkSticky');
            const loginLinkSticky = document.getElementById('loginLinkSticky');
            const accountLinkMobile = document.getElementById('accountLinkMobile');
            const loginLinkMobile = document.getElementById('loginLinkMobile');

            if (CustomerAuth.isAuthenticated()) {
                if (accountLink) {
                    accountLink.style.display = 'inline-flex';
                    accountLink.href = 'account.html';
                }
                if (accountLinkSticky) {
                    accountLinkSticky.style.display = 'inline-flex';
                    accountLinkSticky.href = 'account.html';
                }
                if (accountLinkMobile) {
                    accountLinkMobile.style.display = 'block';
                    accountLinkMobile.href = 'account.html';
                }
                if (loginLink) loginLink.style.display = 'none';
                if (loginLinkSticky) loginLinkSticky.style.display = 'none';
                if (loginLinkMobile) loginLinkMobile.style.display = 'none';
            } else {
                if (accountLink) accountLink.style.display = 'none';
                if (accountLinkSticky) accountLinkSticky.style.display = 'none';
                if (accountLinkMobile) accountLinkMobile.style.display = 'none';
                if (loginLink) loginLink.style.display = 'inline';
                if (loginLinkSticky) loginLinkSticky.style.display = 'inline';
                if (loginLinkMobile) loginLinkMobile.style.display = 'block';
            }
        }

        // Update on page load
        document.addEventListener('DOMContentLoaded', updateAuthLinks);
    </script>

    <script src="location-popup.js"></script>
</body>

</html>
