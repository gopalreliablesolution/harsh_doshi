<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success - Harssh Doshi</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .success-popup {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .success-popup.active {
            display: flex;
        }

        .success-popup-content {
            background: #fff;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            border-radius: 8px;
            color: #000;
        }

        .success-popup-content h1,
        .success-popup-content p {
            color: #000;
        }

        .success-icon {
            font-size: 64px;
            color: #4CAF50;
            margin-bottom: 20px;
        }

        .order-id {
            background: #f4f4f4;
            padding: 10px 20px;
            border-radius: 5px;
            font-family: monospace;
            margin: 20px 0;
            word-break: break-all;
        }

        .popup-btn {
            margin-top: 30px;
            padding: 12px 30px;
            background: #000;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            font-size: 16px;
        }

        .popup-btn:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div id="header-container"></div>

    <div class="success-popup active" id="successPopup">
        <div class="success-popup-content">
            <div class="success-icon">✓</div>
            <h1>Thank You for Your Purchase!</h1>
            <p>Your order has been placed successfully. We are now processing it.</p>

            <div id="order-info" style="display: none;">
                <p>Order Reference:</p>
                <div class="order-id" id="display-order-id"></div>
            </div>

            <p>A confirmation email will be sent to you shortly.</p>

            <button class="popup-btn" onclick="closePopup()">Continue Shopping</button>
        </div>
    </div>

    <main style="min-height: 100vh;"></main>

    <div id="footer-container"></div>

    <script src="header-loader.js"></script>
    <script src="footer-loader.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order_id');
        if (orderId) {
            document.getElementById('order-info').style.display = 'block';
            document.getElementById('display-order-id').textContent = orderId;
        }

        function closePopup() {
            document.getElementById('successPopup').classList.remove('active');
            window.location.href = 'shop.html';
        }
    </script>
</body>

</html>
