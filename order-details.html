<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details - Harssh Doshi</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="customer-auth.js"></script>
    <script src="shopping-bag.js"></script>
    <style>
        body {
            margin-top: 20px;
            padding: 0;
            min-height: 100vh;
            background: #ffffff;
            font-family: 'Arpona Regular', sans-serif;
        }

        .container {
            max-width: 1200px;
            margin: 120px auto 40px;
            padding: 0 20px;
        }

        .page-title {
            font-size: 24px;
            margin-bottom: 30px;
            font-weight: normal;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            margin-bottom: 20px;
            color: #000;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .back-link svg {
            margin-right: 8px;
        }

        .order-details-container {
            display: flex;
            gap: 40px;
        }

        .order-main {
            flex: 2;
        }

        .order-sidebar {
            flex: 1;
            background: #f9f9f9;
            padding: 30px;
            height: fit-content;
        }

        .order-header-info {
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .order-id {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .order-date {
            color: #666;
            font-size: 14px;
        }

        .order-status-badge {
            background: #000;
            color: #fff;
            padding: 5px 12px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .order-section-title {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .order-item {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f5f5f5;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .item-image {
            width: 80px;
            height: 80px;
            background: #f5f5f5;
            object-fit: cover;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-size: 16px;
            margin-bottom: 5px;
            display: block;
        }

        .item-variant {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }

        .item-meta {
            font-size: 14px;
            color: #000;
        }

        .item-price {
            font-weight: 500;
        }

        .address-section {
            margin-bottom: 30px;
        }

        .address-box p {
            margin: 5px 0;
            font-size: 14px;
            color: #333;
            line-height: 1.6;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 14px;
            color: #333;
        }

        .summary-row.total {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 16px;
            font-weight: 600;
            color: #000;
        }

        @media (max-width: 768px) {
            .order-details-container {
                flex-direction: column;
            }

            .container {
                margin-top: 100px;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <!-- Normal layout -->
        <div class="header-normal">
            <div class="logo">
                <a href="index.html" style="color: inherit; text-decoration: none">HARSSH DOSHI</a>
            </div>
            <div class="nav-row">
                <div class="nav-left">
                    <a href="Love Mirage.html" style="white-space: nowrap">LOVE MIRAGE</a>
                    <a href="shop.html">JEWELLERY</a>
                </div>
                <div class="nav-right">
                    <div class="nav-item">
                        <a href="WORLD OF HARSSH DOSHI.html"><span style="white-space: nowrap">
                                <pre>OUR JAGAT</pre>
                            </span></a>
                    </div>
                    <a href="Contact.html">CONTACT</a>
                    <div class="shopping-bag-icon" onclick="toggleShoppingBag()">
                        <label
                            style="font-size: 14px; font-family: 'Arpona Regular', sans-serif; color: #000;">CART<span
                                class="bag-count"></span></label>
                    </div>
                    <a href="account.html" id="accountLink"
                        style="display: none; align-items: center; vertical-align: middle; height: 20px;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block;">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </a>
                    <a href="login.html" id="loginLink"
                        style="display: inline-flex; align-items: center; vertical-align: middle; height: 20px;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block;">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </a>
                </div>
            </div>
        </div>

        <!-- Sticky layout -->
        <div class="sticky-layout">
            <div class="logo">
                <a href="index.html" style="color: inherit; text-decoration: none">HARSSH DOSHI</a>
            </div>
            <div class="nav-right">
                <a href="WORLD OF HARSSH DOSHI.html">OUR JAGAT</a>
                <a href="Contact.html">CONTACT</a>
                <div class="shopping-bag-icon" onclick="toggleShoppingBag()">
                    <label style="font-size: 14px; font-family: 'Arpona Regular', sans-serif;">CART<span
                            class="bag-count"></span></label>
                </div>
                <a href="account.html" id="accountLinkSticky"
                    style="display: none; align-items: center; vertical-align: middle; height: 20px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" style="display: block;">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </a>
                <a href="login.html" id="loginLinkSticky"
                    style="display: inline-flex; align-items: center; vertical-align: middle; height: 20px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" style="display: block;">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <a href="account.html" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            BACK TO ORDERS
        </a>

        <div id="loadingState">
            <p style="text-align: center; margin: 50px 0;">Loading order details...</p>
        </div>

        <div id="orderDetailsContent" style="display: none;">
            <div class="order-header-info">
                <div>
                    <div class="order-id" id="orderIdDisplay">Order #Loading...</div>
                    <div class="order-date" id="orderDateDisplay">Date...</div>
                </div>
                <div class="order-status-badge" id="orderStatusDisplay">Processing</div>
            </div>

            <div class="order-details-container">
                <div class="order-main">
                    <div class="order-section-title">Items</div>
                    <div id="orderItemsList">
                        <!-- Items will be injected here -->
                    </div>

                    <div style="margin-top: 40px;">
                        <div class="order-details-container">
                            <div class="address-section" style="flex: 1;">
                                <div class="order-section-title">Shipping Address</div>
                                <div id="shippingAddress" class="address-box">
                                    <!-- Shipping address -->
                                </div>
                            </div>
                            <div class="address-section" style="flex: 1;">
                                <div class="order-section-title">Billing Address</div>
                                <div id="billingAddress" class="address-box">
                                    <!-- Billing address -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="order-sidebar">
                    <div class="order-section-title">Summary</div>
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="subtotalDisplay">₹0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Shipping</span>
                        <span id="shippingDisplay">₹0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Tax</span>
                        <span id="taxDisplay">₹0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total</span>
                        <span id="totalDisplay">₹0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Loader -->
    <script src="footer-loader.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Check auth
            if (typeof CustomerAuth !== 'undefined' && CustomerAuth.isAuthenticated()) {
                document.getElementById('loginLink').style.display = 'none';
                document.getElementById('loginLinkSticky').style.display = 'none';
                document.getElementById('accountLink').style.display = 'inline-flex';
                document.getElementById('accountLinkSticky').style.display = 'inline-flex';
                loadOrderDetails();
            } else {
                window.location.href = 'login.html';
            }


            async function loadOrderDetails() {
                const urlParams = new URLSearchParams(window.location.search);
                // Support both 'id' and 'order' params
                const orderId = urlParams.get('id') || urlParams.get('order');

                if (!orderId) {
                    document.getElementById('loadingState').innerHTML = '<p>Order ID not found.</p>';
                    return;
                }

                try {
                    const token = CustomerAuth.getToken();

                    // Fetch specific order with expanded fields
                    // Important: Expand items, shipping_address, billing_address, payments to show full details
                    const response = await fetch(`${API_BASE_URL}/store/orders/${orderId}?expand=items,items.variant,items.variant.product,shipping_address,billing_address,payments`, {
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json',
                            'x-publishable-api-key': MEDUSA_CONFIG.PUBLISHABLE_KEY
                        },
                        credentials: 'include'
                    });

                    if (!response.ok) {
                        throw new Error('Failed to fetch order details');
                    }

                    const data = await response.json();
                    const order = data.order;

                    renderOrder(order);

                    document.getElementById('loadingState').style.display = 'none';
                    document.getElementById('orderDetailsContent').style.display = 'block';

                } catch (error) {
                    console.error('Error loading order:', error);
                    document.getElementById('loadingState').innerHTML = '<p>Failed to load order details. Please try again.</p>';
                }
            }

            function renderOrder(order) {
                // Order Header
                document.getElementById('orderIdDisplay').textContent = `Order #${order.display_id || order.id.substring(0, 8)}`;

                const date = new Date(order.created_at).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                document.getElementById('orderDateDisplay').textContent = date;

                document.getElementById('orderStatusDisplay').textContent = order.fulfillment_status || 'Processing';

                // Items
                const itemsList = document.getElementById('orderItemsList');
                itemsList.innerHTML = order.items.map(item => {
                    const price = item.unit_price.toFixed(2);
                    const thumbnail = item.thumbnail || item.variant?.product?.thumbnail || 'placeholder.jpg'; // Fallback needed
                    const title = item.title;
                    const variantTitle = item.variant?.title !== 'Default Variant' ? item.variant?.title : '';

                    return `
                    <div class="order-item">
                        <img src="${thumbnail}" alt="${title}" class="item-image" onerror="this.src='https://placehold.co/80x80?text=No+Image'">
                        <div class="item-details">
                            <span class="item-name">${title}</span>
                            ${variantTitle ? `<span class="item-variant">${variantTitle}</span>` : ''}
                            <div class="item-meta">
                                Qty: ${item.quantity} × ₹${price}
                            </div>
                        </div>
                        <div class="item-price">
                            ₹${(item.unit_price * item.quantity).toFixed(2)}
                        </div>
                    </div>
                `;
                }).join('');

                // Addresses
                const formatAddress = (addr) => {
                    if (!addr) return 'No address provided';
                    return `
                    <p style="font-weight: 500;">${addr.first_name || ''} ${addr.last_name || ''}</p>
                    <p>${addr.address_1 || ''}</p>
                    ${addr.address_2 ? `<p>${addr.address_2}</p>` : ''}
                    <p>${addr.city || ''}, ${addr.province || ''} ${addr.postal_code || ''}</p>
                    <p>${addr.country_code ? addr.country_code.toUpperCase() : ''}</p>
                    <p>${addr.phone || ''}</p>
                `;
                };

                document.getElementById('shippingAddress').innerHTML = formatAddress(order.shipping_address);
                document.getElementById('billingAddress').innerHTML = formatAddress(order.billing_address);

                // Summary
                const subtotal = order.subtotal.toFixed(2);
                const shipping = order.shipping_total.toFixed(2);
                const tax = order.tax_total.toFixed(2);
                const total = order.total.toFixed(2);

                document.getElementById('subtotalDisplay').textContent = `₹${subtotal}`;
                document.getElementById('shippingDisplay').textContent = `₹${shipping}`;
                document.getElementById('taxDisplay').textContent = `₹${tax}`;
                document.getElementById('totalDisplay').textContent = `₹${total}`;
            }
    </script>
</body>

</html>
